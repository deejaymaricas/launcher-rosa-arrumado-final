plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvlauncher.simples'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvlauncher.simples'
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName '3.2.1'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
